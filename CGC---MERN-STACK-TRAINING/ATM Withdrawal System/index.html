<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Withdrawal Function</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        input, button {
            padding: 10px;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <h2>Withdrawal Function</h2>
    <label for="withdrawalAmount">Enter Withdrawal Amount: </label>
    <input type="number" id="withdrawalAmount" placeholder="Enter Amount" />
    <label for="balance">Available Balance: </label>
    <input type="number" id="balance" placeholder="Enter Balance" />
    <button onclick="processWithdrawal()">Withdraw</button>
    <p id="result"></p>

    <script>
        function processWithdrawal() {
            var withdrawalAmount = parseInt(document.getElementById('withdrawalAmount').value);
            var balance = parseInt(document.getElementById('balance').value);
            var result = '';

            if (withdrawalAmount % 100 === 0 || withdrawalAmount % 200 === 0 || withdrawalAmount % 500 === 0 || withdrawalAmount % 2000 === 0) {
                if (balance >= withdrawalAmount) {
                    balance -= withdrawalAmount;
                    result = 'Withdrawal successful! New balance: ₹' + balance;
                } else {
                    result = 'Error: Insufficient funds!';
                }
            } else {
                result = 'Error: Withdrawal amount must be in multiples of ₹100, ₹200, ₹500, or ₹2000!';
            }
            
            document.getElementById('result').innerHTML = result;
        }
    </script>
</body>
</html>
