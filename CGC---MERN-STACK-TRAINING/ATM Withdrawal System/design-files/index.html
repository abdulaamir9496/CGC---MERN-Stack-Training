<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATM Withdrawal System</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="container">
        <h2>ATM Withdrawal</h2>
        <label for="withdrawalAmount">Enter Withdrawal Amount (₹):</label>
        <input type="number" id="withdrawalAmount" placeholder="Amount in ₹">
        <button onclick="processWithdrawal()">Withdraw</button>

        <p id="message"></p>
    </div>

    <script src="script.js"></script>
</body>
</html>
