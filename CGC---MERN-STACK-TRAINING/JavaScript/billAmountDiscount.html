<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discount Calculator</title>
</head>
<body>
    <script>
        function calculateFinalAmount(billAmount) {
            let discount = 0;
            
            if (billAmount >= 500 && billAmount <= 1000) {
                discount = 0.10;
            } else if (billAmount > 1000 && billAmount <= 2000) {
                discount = 0.20;
            } else if (billAmount > 2000) {
                discount = 0.30;
            }
            
            let finalAmount = billAmount - (billAmount * discount);
            return `Final amount to be paid: Rs.${finalAmount}`;
        }
        
        var billAmount = prompt("Enter the total bill amount: ");
        billAmount = Number(billAmount);
        var result = calculateFinalAmount(billAmount);
        alert(result);
    </script>
</body>
</html>
