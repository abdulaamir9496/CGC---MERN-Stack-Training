<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Electricity Bill Calculator</title>
    <link rel="stylesheet" href="styles2.css">
</head>
<body>
    <div class="container">
        <h2>Electricity Bill Calculator</h2>
        <button id="themeToggle">🌙 Dark Mode</button>
        <label for="units">Enter Power Units:</label>
        <input type="number" id="units" placeholder="Enter units" required>
        <button onclick="calculateBill()">Calculate</button>
        <button onclick="clearFields()">Reset</button>
        <button onclick="downloadBill()">Download PDF</button>
        <h3 id="result"></h3>
        
        <h3>QR Code for Payment:</h3>
        <canvas id="qrCodeCanvas"></canvas>
        
        <h3>Usage Trends:</h3>
        <canvas id="usageChart" width="300" height="200"></canvas>

        <h3>Previous Bills:</h3>
        <ul id="billHistory"></ul>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="script2.js"></script>
</body>
</html>
