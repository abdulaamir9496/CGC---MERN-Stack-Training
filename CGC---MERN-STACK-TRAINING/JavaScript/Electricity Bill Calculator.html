<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Electricity Bill Calculator</title>
</head>
<body>
    <script>
        function calculateElectricityBill(units) {
            let bill = 0;
            
            if (units <= 50) {
                bill = units * 2.50;
            } else if (units <= 100) {
                bill = (50 * 2.50) + ((units - 50) * 4);
            } else if (units <= 200) {
                bill = (50 * 2.50) + (50 * 4) + ((units - 100) * 6);
            } else {
                bill = (50 * 2.50) + (50 * 4) + (100 * 6) + ((units - 200) * 8);
            }
            
            return `Total electricity bill: Rs.${bill}`;
        }
        
        var units = prompt("Enter the consumed electricity units: ");
        units = Number(units);
        var result = calculateElectricityBill(units);
        alert(result);
    </script>
</body>
</html>
